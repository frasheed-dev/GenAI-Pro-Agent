name: Autonomous AI Agent Cron

on:
  schedule:
    # Runs every 6 hours. Adjust the cron syntax as needed.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    # We need permission to commit back the state.json
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can commit
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Agent
        env:
          # Inject secrets stored in GitHub Settings -> Secrets and variables -> Actions
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IMAGE_HOST: 'imgbb'
          AUTONOMOUS_MODE: 'true'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          python main.py

      - name: Commit State Tracking
        # Only run this step if state.json was modified
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles_state.json
          
          # Only commit if there are changes to avoid failing the action
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update state.json tracking [skip ci]" && git push)
